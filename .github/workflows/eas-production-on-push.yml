# EAS production builds — MANUAL ONLY to conserve iOS build quota.
# Do NOT trigger on push. Run from Actions tab when you need a build.
# Requires: EXPO_TOKEN in repo Secrets.

name: EAS Production Build (manual)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "ios"
        type: choice
        options:
          - ios
          - android
          - both

jobs:
  eas-build:
    name: EAS Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        continue-on-error: true

      - name: Install dependencies (fallback)
        if: failure()
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Run EAS production workflow (iOS only)
        if: inputs.platform == 'ios'
        run: npx eas-cli@latest workflow:run create-production-builds-ios-only.yml --non-interactive

      - name: Run EAS production workflow (Android only)
        if: inputs.platform == 'android'
        run: npx eas-cli@latest workflow:run create-production-builds-android-only.yml --non-interactive

      - name: Run EAS production workflow (both)
        if: inputs.platform == 'both'
        run: npx eas-cli@latest workflow:run create-production-builds.yml --non-interactive
